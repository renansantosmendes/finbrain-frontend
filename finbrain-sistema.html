<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinBrain · Sistema (V0)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap" rel="stylesheet">
<style>:root{--ink:#06161F;--ink2:#0A222F;--ink3:#0F2E3F;--line-d:rgba(255,255,255,.12);--teal:#14A9B9;--teal-l:#3AC7D6;--teal-d:#0B6571;--paper:#F3F1EA;--paper2:#E9E6DA;--card:#FFFFFF;--line:#D9D4C5;--tx:#0F1D26;--mut:#4B5963;--up:#3DD598;--dn:#FF6B5E;--upl:#1E8F5B;--dnl:#C23B34}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;background:var(--paper);color:var(--tx);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit}
h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,serif;margin:0;font-weight:500;letter-spacing:-0.01em}
p{margin:0;line-height:1.6}
[hidden]{display:none!important}
button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:2px;font-family:'Public Sans',sans-serif;font-weight:700;font-size:15px;letter-spacing:.01em;cursor:pointer;border:1.5px solid transparent;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn-t{background:var(--teal);color:#04141C}
.btn-t:hover{background:var(--teal-l)}
.btn-o{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.4)}
.btn-o:hover{border-color:#FFFFFF}
.btn-ol{background:transparent;color:var(--tx);border-color:var(--tx)}
.btn-ol:hover{background:var(--tx);color:#FFFFFF}
.btn-sm{min-height:38px;padding:0 16px;font-size:13.5px}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,.cd:focus-visible{outline:3px solid var(--teal-l);outline-offset:2px}
.btn.loading{pointer-events:none;opacity:.85}
.btn.loading::after{content:"";width:15px;height:15px;border:2.5px solid rgba(4,20,28,.3);border-top-color:#04141C;border-radius:50%;animation:spin .7s linear infinite}

/* Cabeçalho */
.hdr{background:var(--ink);border-bottom:1px solid var(--line-d);position:sticky;top:0;z-index:50}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo b{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:23px;color:#FFFFFF;letter-spacing:-.01em}
.logo span{display:block;font-size:11.5px;color:#8FA6B3;margin-top:1px;letter-spacing:.02em}
.nav{display:flex;align-items:center;gap:26px}
.nav a.l{text-decoration:none;color:#B8C9D2;font-size:14.5px;font-weight:500}
.nav a.l:hover{color:#FFFFFF}

/* Hero */
.hero{position:relative;background-color:var(--ink);background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;color:#FFFFFF;padding:84px 0 72px;overflow:hidden}
.hero-g{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(38px,5vw,64px);line-height:1.04;font-weight:500;color:#FFFFFF}
.hero h1 em{font-style:italic;color:var(--teal-l)}
.lead{margin-top:24px;font-size:18px;color:#B8C9D2;max-width:520px}
.kicker{display:flex;align-items:center;gap:12px;color:var(--teal-l)}
.kicker::before{content:"";width:28px;height:1.5px;background:var(--teal-l)}
.fine{font-size:13px;color:#8FA6B3}

/* Gráficos */
.chart-card{background:var(--ink2);border:1px solid var(--line-d);border-radius:2px;padding:18px 18px 8px}
.chart-card.light{background:var(--card);border-color:var(--line)}
.ch-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:8px}
.ch-t{font-size:15px;font-weight:700}
.ch-s{font-size:12.5px;margin-top:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:6px 0 8px;align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg-up{width:12px;height:12px;border:2px solid var(--c)}
.lg-dn{width:12px;height:12px;background:var(--c)}
.lg-ma{width:18px;height:2px;background:var(--ma)}
.tbtn{background:none;border:1px solid currentColor;color:inherit;border-radius:2px;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer;opacity:.85}
.tbtn:hover{opacity:1}
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart.dark{--surf:#0A222F;--grid:rgba(255,255,255,.09);--txt:#8FA6B3;--up:#3DD598;--dn:#FF6B5E;--ma:#E3EEF3;--band:rgba(20,169,185,.3);--bandtxt:#6FD8E4}
.chart.light{--surf:#FFFFFF;--grid:#E6E2D6;--txt:#55636C;--up:#1E8F5B;--dn:#C23B34;--ma:#0F1D26;--band:rgba(11,101,113,.12);--bandtxt:#0B6571}
.chart text{font-family:'JetBrains Mono',monospace;font-size:17px;fill:var(--txt)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.cd{--c:var(--up);cursor:crosshair;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .5s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*16ms)}
.cd.dn{--c:var(--dn)}
.cd .wick{stroke:var(--c);stroke-width:1.7;stroke-linecap:round}
.cd.up .body{fill:var(--surf);stroke:var(--c);stroke-width:1.8}
.cd.dn .body{fill:var(--c);stroke:var(--c);stroke-width:1.8}
.cd:hover .body,.cd:focus .body{stroke-width:3}
.cd:focus{outline:none}
.cd .hit{fill:transparent}
.cd:focus-visible .hit{stroke:var(--bandtxt);stroke-width:1.5;stroke-dasharray:3 3}
.ma{fill:none;stroke:var(--ma);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset 1.8s ease .5s}
.band{fill:var(--band);transition:opacity .8s ease 1.3s}
.band-l{fill:var(--bandtxt)!important;font-weight:700}
.last-l{stroke:var(--txt);stroke-dasharray:3 4;stroke-width:1}
.tag-bg{fill:var(--txt)}
.tag-t{fill:var(--surf)!important;font-weight:700}
.anim .chart:not(.in) .cd{opacity:0;transform:scaleY(.15)}
.anim .chart:not(.in) .ma{stroke-dashoffset:1}
.anim .chart:not(.in) .band{opacity:0}
.dtab{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:12.5px}
.dtab caption{text-align:left;padding:4px 0 8px;font-weight:600}
.dtab th,.dtab td{padding:6px 8px;border-bottom:1px solid var(--grid,#ccc);text-align:right;font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.dtab th:first-child,.dtab td:first-child{text-align:left}
.dtab-wrap{max-height:220px;overflow:auto}
.tip{position:fixed;z-index:80;pointer-events:none;background:#031018;color:#E8F1F5;border:1px solid rgba(255,255,255,.2);border-radius:2px;padding:9px 11px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:150px}
.tip b{display:block;margin-bottom:3px;font-family:'Public Sans',sans-serif;font-size:12.5px}
.tip .u{color:#3DD598}.tip .d{color:#FF8A7E}

/* Pergunta e resposta */
.qa{border-top:1px solid var(--line-d);margin-top:10px;padding:16px 4px 14px}
.q{display:flex;gap:10px;font-size:15px;font-weight:600;color:#FFFFFF}
.q .p{font-family:'JetBrains Mono',monospace;color:var(--teal-l)}
.ans{margin-top:12px;font-size:14.5px;color:#C9D8DF}
.ans ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ans li{display:flex;gap:12px}
.ans li .num{min-width:92px;color:#FFFFFF;font-weight:700}
.refs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ref{font-family:'JetBrains Mono',monospace;font-size:11.5px;border:1px solid rgba(58,199,214,.5);color:var(--teal-l);padding:3px 8px;border-radius:2px}
.fund{margin-top:12px;font-size:12.5px;color:#8FA6B3}
.fund b{color:var(--up)}

/* Ticker */
.ticker{background:var(--ink3);border-block:1px solid var(--line-d);color:#E3EEF3;overflow:hidden}
.ticker-in{display:flex;align-items:center}
.ticker-lbl{flex:none;padding:0 18px;background:var(--teal);color:#04141C;align-self:stretch;display:flex;align-items:center}
.track{display:flex;gap:56px;width:max-content;padding:14px 28px;animation:tick 48s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.tk{display:flex;gap:12px;align-items:baseline;white-space:nowrap;font-size:14px}
.tk .k{color:#8FA6B3}
.tk .v{font-family:'JetBrains Mono',monospace;font-weight:700;color:#FFFFFF}
.tk .dl{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.u{color:var(--up)}.d{color:var(--dn)}

/* Seções */
.sec{padding:100px 0}
.sec.dark{background:var(--ink);color:#E3EEF3}
.sec.paper2{background:var(--paper2)}
.sh{display:flex;align-items:center;gap:16px;margin-bottom:22px;color:var(--teal-d)}
.sec.dark .sh{color:var(--teal-l)}
.sh::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.sec h2{font-size:clamp(30px,3.6vw,46px);line-height:1.08;max-width:760px}
.sec.dark h2{color:#FFFFFF}
.sec-lead{margin-top:18px;font-size:17px;color:var(--mut);max-width:640px}
.sec.dark .sec-lead{color:#B8C9D2}
.feat{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center;padding:56px 0;border-top:1px solid var(--line)}
.feat.rev{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}
.feat.rev .ft{order:2}
.feat h3{font-size:28px;line-height:1.15}
.feat p{margin-top:14px;color:var(--mut);font-size:16px}
.ftag{display:inline-block;margin-bottom:14px;color:var(--teal-d)}
.qtypes{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border:1px solid var(--line);background:var(--card)}
.qtypes li{padding:18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.qtypes .t{color:var(--teal-d);margin-bottom:8px}
.qtypes .e{font-family:'Source Serif 4',Georgia,serif;font-style:italic;font-size:17px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--card);margin-bottom:16px}
.kpi{padding:16px 18px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12.5px;color:var(--mut)}
.kpi .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:21px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:4px;font-weight:600}
.kpi .d.d{color:var(--dnl)}.kpi .d.u{color:var(--upl)}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:22px}
.card h4{font-size:17px;font-family:'Public Sans',sans-serif;font-weight:700}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr) 78px;gap:10px 14px;align-items:center;font-size:14px;margin-top:14px}
.hb .tr{height:14px;background:#EFEBDF;position:relative}
.hb .fl{position:absolute;left:0;top:0;bottom:0;background:var(--teal-d);transform-origin:left;transition:transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.anim .rv:not(.in) .fl{transform:scaleX(0)}
.sens{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px 12px;align-items:center;font-size:13.5px;margin-top:12px}
.sens .ax{height:16px;position:relative;background:linear-gradient(90deg,transparent calc(50% - .5px),#B9B3A2 calc(50% - .5px),#B9B3A2 calc(50% + .5px),transparent calc(50% + .5px))}
.sens .b{position:absolute;top:1px;bottom:1px;transition:transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.sens .b.n{right:50%;background:var(--dnl);transform-origin:right}
.sens .b.p{left:50%;background:var(--upl);transform-origin:left}
.anim .rv:not(.in) .sens .b{transform:scaleX(0)}
.doc{border:1px solid var(--line);background:var(--card);padding:22px 24px}
.doc .row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.doc .row:last-child{border-bottom:0}
.badge{display:inline-block;border:1px solid var(--tx);padding:2px 8px;font-size:11.5px;font-weight:700;letter-spacing:.04em}

/* Fluxo RAG */
.flow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border:1px solid var(--line-d);margin-top:48px}
.fs{padding:22px 16px 20px;border-right:1px solid var(--line-d);position:relative;opacity:.4;transition:opacity .6s ease}
.fs:last-child{border-right:0}
.fs.on{opacity:1}
.fs .n{color:var(--teal-l)}
.fs h3{font-family:'Public Sans',sans-serif;font-weight:700;font-size:15.5px;margin-top:10px;color:#FFFFFF;line-height:1.25}
.fs p{margin-top:8px;font-size:13px;color:#9FB6C1;line-height:1.5}
.fs::before{content:"";position:absolute;left:0;top:0;height:3px;width:0;background:var(--teal);transition:width 1s ease}
.fs.on::before{width:100%}
.callout{margin-top:28px;border-left:3px solid var(--teal);padding:4px 0 4px 18px;color:#D3E1E8;font-size:16px;max-width:760px}

/* Rastreabilidade */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.wf .bar{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.7,.2,1) calc(var(--i)*.14s)}
.anim .wf:not(.in) .bar{transform:scaleY(0)}
.wf text{font-family:'JetBrains Mono',monospace;font-size:12px;fill:var(--tx)}
.wf .cat{font-family:'Public Sans',sans-serif;font-size:12px;fill:var(--mut)}
.wf .cn{stroke:#9B9686;stroke-dasharray:3 3;stroke-width:1}
.chain{display:flex;gap:0;align-items:center;margin:18px 0 6px}
.chain .c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;flex:none}
.chain .c b{width:34px;height:34px;border-radius:50%;background:var(--teal-d);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px}
.chain .ln{flex:1;height:1.5px;background:var(--teal-d);margin:0 6px 20px;opacity:.5}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;color:var(--mut);padding:8px 10px;border-bottom:1.5px solid var(--tx);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line)}
.hash{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#EFEBDF;border:1px solid var(--line);padding:8px 10px;margin-top:10px;word-break:break-all}
.tw{overflow-x:auto}

/* Fontes e integrações */
.src{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);background:var(--card)}
.src>div{padding:22px 20px;border-right:1px solid var(--line)}
.src>div:last-child{border-right:0}
.src h3{font-family:'Public Sans',sans-serif;font-size:16px;font-weight:700}
.src p{font-size:13.5px;color:var(--mut);margin-top:8px}
.ep{font-family:'JetBrains Mono',monospace;font-size:13px}
.ep .m{display:inline-block;min-width:48px;font-weight:700;color:var(--teal-d)}

/* Segurança */
.ctl{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:16px 0;border-bottom:1px solid var(--line-d)}
.ctl b{color:#FFFFFF;font-weight:600}
.ctl p{color:#9FB6C1;font-size:15px}
.fn{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);background:var(--card);margin-top:40px}
.fn>div{padding:24px 26px}
.fn>div:first-child{border-right:1px solid var(--line)}
.fn h4{font-family:'Public Sans',sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
.fn ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px}
.fn li{display:flex;gap:10px}
.fn .yes li::before{content:"+";font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--upl)}
.fn .no li::before{content:"–";font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--dnl)}

/* Acesso */
.acc{position:relative;background:var(--ink);color:#E3EEF3;overflow:hidden}
.waves-band{position:relative;height:clamp(120px,16vw,220px);overflow:hidden;background:#0F2E3F}
.waves{position:absolute;top:0;bottom:0;left:0;width:118%;background:#0F2E3F none center 40% / cover no-repeat;animation:drift 42s ease-in-out infinite alternate}
.lgn{background:#FFFFFF;color:var(--tx);border-radius:2px;padding:36px 32px;max-width:460px;width:100%;justify-self:end}
.lgn h3{font-size:28px}
.fld{margin-top:18px}
.lbl{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.field{width:100%;height:48px;border:1.5px solid #AEB6BB;border-radius:2px;padding:0 14px;font-size:16px;font-family:'Public Sans',sans-serif;background:#FFFFFF;color:var(--tx)}
.field:focus{border-color:var(--teal-d);box-shadow:0 0 0 3px rgba(20,169,185,.25)}
.field[aria-invalid="true"]{border-color:var(--dnl)}
.pw{position:relative}.pw .field{padding-right:90px}
.eye{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:0;background:transparent;color:var(--teal-d);font-weight:700;font-size:13.5px;cursor:pointer}
.err{margin-top:7px;font-size:13px;font-weight:600;color:var(--dnl)}
.msg{margin-top:16px;font-size:14px;background:#E3F6F8;border-left:4px solid var(--teal-d);padding:12px 14px}
.lk{background:none;border:0;padding:0;color:var(--teal-d);font-weight:700;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.roles{margin-top:28px;border-top:1px solid var(--line-d);max-width:520px}
.roles div{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line-d);font-size:14.5px}
.roles b{width:170px;flex:none;color:#FFFFFF;font-weight:600}
.roles span{color:#9FB6C1}
.foot{background:#FFFFFF;border-top:4px solid var(--teal)}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:28px 24px}

/* Revelação ao rolar */
.anim .rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.anim .rv.in{opacity:1;transform:none}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-15%)}}

@media (max-width:1000px){
  .hero-g,.two,.feat,.feat.rev{grid-template-columns:minmax(0,1fr);gap:36px}
  .feat.rev .ft{order:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fs{border-bottom:1px solid var(--line-d)}
  .src{grid-template-columns:repeat(2,minmax(0,1fr))}
  .src>div:nth-child(2){border-right:0}
  .src>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .lgn{justify-self:start}
}
@media (max-width:720px){
  .sec{padding:68px 0}
  .hero{padding:56px 0 48px}
  .hide-m{display:none}
  .ctl{grid-template-columns:1fr;gap:4px}
  .fn{grid-template-columns:1fr}
  .fn>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .hb{grid-template-columns:96px minmax(0,1fr) 60px}
  .sens{grid-template-columns:104px minmax(0,1fr) 58px}
  .roles div{flex-direction:column;gap:2px}
  .waves{width:160%}
  .chart{overflow-x:auto}
  .chart svg{min-width:620px}
}
@media (max-width:480px){
  .kpis{grid-template-columns:1fr}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
  .flow,.src{grid-template-columns:1fr}
  .src>div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .anim .rv{opacity:1!important;transform:none!important}
  .anim .chart:not(.in) .cd,.anim .chart:not(.in) .band{opacity:1!important;transform:none!important}
  .track{flex-wrap:wrap;width:auto}
}

#sys{background:var(--ink);color:#B8C9D2;min-height:100vh;font-family:'Public Sans',system-ui,sans-serif}
#sys h1,#sys h2,#sys h3{font-family:'Public Sans',sans-serif;color:#F1F6F8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#sys .stb{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:10px 20px;background:#031018;border-bottom:1px solid var(--line-d)}
#sys .logo{padding:0}
#sys .logo b{font-size:20px}
#sys .logo span{margin:0}
#sys .sch{position:relative;flex:0 1 320px}
#sys .sch svg{position:absolute;left:12px;top:11px;width:18px;height:18px;stroke:#8FA6B3;fill:none;stroke-width:2;stroke-linecap:round}
#sys .sch input{width:100%;height:40px;background:var(--ink2);border:1px solid var(--line-d);color:#fff;padding:0 12px 0 38px;font-size:14px;font-family:inherit;border-radius:2px}
#sys .sch input::placeholder{color:#8FA6B3}
#sys .mini{display:flex;gap:22px;flex:1;overflow:hidden;font-size:13px;white-space:nowrap}
#sys .mini span{display:flex;gap:8px;align-items:baseline}
#sys .mini .k{color:#8FA6B3}
#sys .mini .v{font-family:'JetBrains Mono',monospace;color:#fff;font-weight:700}
#sys .mini .c{font-family:'JetBrains Mono',monospace;font-size:12px}
#sys .bdg{font-size:11.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#F2C14E;border:1px solid rgba(242,193,78,.55);padding:5px 10px;border-radius:2px;white-space:nowrap}
#sys .shell{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;gap:14px;padding:14px;align-items:start}
#sys .pn{background:var(--ink2);border:1px solid var(--line-d);border-radius:2px;padding:16px;min-width:0}
#sys .ph{font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#8FA6B3;font-weight:500;margin:0 0 10px}
#sys .side,#sys .mid{display:flex;flex-direction:column;gap:14px;min-width:0}
#sys .wlt{width:100%;border-collapse:collapse;font-size:13.5px}
#sys .wlt th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8FA6B3;padding:4px 6px 8px;font-weight:500}
#sys .wlt th.r,#sys .wlt td.r{text-align:right}
#sys .wlt tbody tr{cursor:pointer;border-top:1px solid var(--line-d)}
#sys .wlt tbody tr:hover{background:rgba(255,255,255,.04)}
#sys .wlt tbody tr[aria-selected="true"]{background:rgba(20,169,185,.16);box-shadow:inset 3px 0 0 var(--teal-l)}
#sys .wlt td{padding:9px 6px;vertical-align:middle}
#sys .wlt .sy{font-weight:700;color:#fff}
#sys .wlt .sy small{display:block;font-weight:400;color:#8FA6B3;font-size:11.5px}
#sys .wlt td.r{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:#E3EEF3}
#sys .wlt td.r.u{color:var(--up)}#sys .wlt td.r.d{color:var(--dn)}
#sys .wlt tr:focus-visible{outline:2px solid var(--teal-l);outline-offset:-2px}
#sys .mc{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line-d);font-size:13.5px}
#sys .mc:first-child{border-top:0}
#sys .mc b{font-family:'JetBrains Mono',monospace;color:#fff}
#sys .mc small{display:block;color:#8FA6B3;font-size:11.5px}
#sys .u{color:var(--up)}#sys .d{color:var(--dn)}
#sys .ah{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
#sys .ah h1{font-size:22px;line-height:1.1}
#sys .ah h1 small{font-weight:400;color:#8FA6B3;font-size:14px;margin-left:8px}
#sys .px{display:flex;align-items:baseline;gap:12px;margin-top:8px;flex-wrap:wrap}
#sys .px b{font-family:'JetBrains Mono',monospace;font-size:30px;color:#fff}
#sys .px span{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}
#sys .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sys .seg{display:inline-flex;border:1px solid var(--line-d)}
#sys .seg button{background:transparent;border:0;color:#B8C9D2;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;border-right:1px solid var(--line-d)}
#sys .seg button:last-child{border-right:0}
#sys .seg button:hover{color:#fff}
#sys .seg button[aria-pressed="true"]{background:var(--teal);color:#04141C}
#sys .ck{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:#B8C9D2;cursor:pointer}
#sys .ck input{accent-color:var(--teal);width:16px;height:16px}
#sys .chart .ma20{stroke:var(--teal-l);stroke-dasharray:7 5;stroke-dashoffset:0}
#sys .no5 .ma5,#sys .no20 .ma20{display:none}
#sys .dense .cd .wick{stroke-width:1}
#sys .dense .cd .body{stroke-width:1}
#sys .dense .cd:hover .body{stroke-width:2}
#sys .stat{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line-d);margin-top:6px}
#sys .stat>div{padding:10px 8px 4px;border-right:1px solid var(--line-d)}
#sys .stat>div:last-child{border-right:0}
#sys .stat span{display:block;font-size:11.5px;color:#8FA6B3}
#sys .stat b{display:block;margin-top:3px;color:#fff;font-size:14px;font-family:'JetBrains Mono',monospace}
#sys .ig{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:10px 0 6px}
#sys .fl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#8FA6B3;font-weight:600}
#sys .fl output{font-family:'JetBrains Mono',monospace;color:#fff;font-weight:700}
#sys .fl input{width:100%;accent-color:var(--teal)}
#sys .sk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-d);margin:8px 0}
#sys .sk>div{padding:10px 12px;border-right:1px solid var(--line-d)}
#sys .sk>div:last-child{border-right:0}
#sys .sk span{display:block;font-size:12px;color:#8FA6B3}
#sys .sk b{display:block;margin-top:4px;color:#fff;font-size:18px;font-family:'JetBrains Mono',monospace}
#sys .fan .band-p{fill:rgba(20,169,185,.25)}
#sys .fan .p50{fill:none;stroke:var(--teal-l);stroke-width:2.6;stroke-linecap:round}
#sys .fan .inv{fill:none;stroke:#8FA6B3;stroke-width:2;stroke-dasharray:7 6}
#sys .fan .hv{fill:transparent;cursor:crosshair}
#sys .fan .hv:hover,#sys .fan .hv:focus{fill:rgba(20,169,185,.12);outline:none}
#sys .fan .lbl2{font-weight:700;fill:#fff!important}
#sys .brain{position:sticky;top:64px;height:calc(100vh - 78px);display:flex;flex-direction:column;gap:10px;padding:14px}
#sys .bh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
#sys .bs{font-size:12.5px;color:#8FA6B3;margin-top:3px}
#sys .bm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px;min-height:160px}
#sys .mu{align-self:flex-end;max-width:90%;background:var(--ink3);border:1px solid var(--line-d);padding:9px 12px;color:#fff;font-size:14px;line-height:1.45}
#sys .ma{background:var(--ink);border:1px solid var(--line-d);border-left:3px solid var(--teal);padding:12px 14px;font-size:14px;line-height:1.55;color:#C9D8DF}
#sys .ma.blk{border-left-color:var(--dn)}
#sys .ma.lim{border-left-color:#F2C14E}
#sys .ma b{color:#fff}
#sys .ma .num{font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff}
#sys .ma .note{font-size:12px;color:#8FA6B3;margin-top:8px}
#sys .tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
#sys .tool{font-family:'JetBrains Mono',monospace;font-size:11px;color:#B8C9D2;background:rgba(255,255,255,.06);border:1px solid var(--line-d);padding:2px 7px;border-radius:2px}
#sys .refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#sys .ref{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid rgba(58,199,214,.5);color:var(--teal-l);padding:2px 7px;border-radius:2px}
#sys .bc{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;flex:none}
#sys .bc .chp{white-space:nowrap;flex:none}
#sys .wlt td.r{white-space:nowrap}
#sys .chp{background:transparent;border:1px solid rgba(58,199,214,.45);color:var(--teal-l);font-size:12px;padding:5px 9px;border-radius:2px;cursor:pointer;font-family:inherit;text-align:left}
#sys .chp:hover{background:rgba(58,199,214,.1)}
#sys .bf{display:flex;gap:8px;align-items:flex-end}
#sys .bf textarea{flex:1;min-height:42px;max-height:110px;height:42px;background:var(--ink);border:1.5px solid var(--line-d);color:#fff;padding:11px 12px;font-size:14px;font-family:inherit;border-radius:2px;resize:none;line-height:1.3}
#sys .bf textarea:focus{outline:2px solid var(--teal-l);outline-offset:1px}
#sys .bd{font-size:11.5px;color:#8FA6B3;margin:0}
#sys .trail{max-height:130px;flex:none;overflow:auto;border:1px solid var(--line-d);background:var(--ink);padding:4px 10px}
#sys .trail div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line-d);font-family:'JetBrains Mono',monospace;font-size:11px;color:#B8C9D2}
#sys .trail div:last-child{border-bottom:0}
#sys .trail b{color:#fff}
#sys .typing{color:#8FA6B3;font-size:13px}
#sys .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--teal-l);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@media (max-width:1180px){
  #sys .shell{grid-template-columns:minmax(0,1fr)}
  #sys .brain{position:static;height:600px}
  #sys .side{flex-direction:row;overflow-x:auto}
  #sys .side .pn{min-width:300px;flex:1}
  #sys .mini{display:none}
  #sys .stb{flex-wrap:wrap}
}
@media (max-width:720px){
  #sys .side{flex-direction:column;overflow:visible}
  #sys .side .pn{min-width:0}
  #sys .ig{grid-template-columns:repeat(2,minmax(0,1fr))}
  #sys .stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  #sys .stat>div:nth-child(2n){border-right:0}
  #sys .sk{grid-template-columns:repeat(2,minmax(0,1fr))}
  #sys .sk>div:nth-child(2){border-right:0}
  #sys .sk>div:nth-child(-n+2){border-bottom:1px solid var(--line-d)}
  #sys .bdg{display:none}
  #sys .shell{padding:10px}
  #sys .chart{overflow-x:auto}#sys .chart svg{min-width:640px}
  #sys .sch{flex:1}
}
